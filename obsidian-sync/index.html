<main><h1>Obsidian Sync</h1>
<p>Obsidian Sync 是站点所有者个人使用的 Google OAuth 应用，用于通过本机 rclone 在个人电脑和 Google Drive 之间同步 Obsidian 文档。</p>
<p>这是个人工具，不对公众提供注册、托管或同步服务。本网页仅介绍应用并提供隐私政策，不执行同步，也不接收 Google 授权令牌。</p>
<p>应用申请 Google Drive 文件访问权限，以读取和同步已有文档。授权通过 Google 官方页面进行；同步配置和授权令牌保存在使用者自己的电脑中。</p>
<p><a href="privacy.html">隐私政策 / Privacy Policy</a> · <a href="https://github.com/lelelelelelelelelelelelele">所有者 / Owner</a></p>
